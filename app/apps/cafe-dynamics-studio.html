<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafe Dynamics Studio: stock-and-flow modelling with Bayesian estimation</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2933;--mut:#6b7280;--line:#e5e7eb;--acc:#92400e;--acc2:#b45309;--sel:#2a78d6;--err:#b91c1c;--warn:#b45309;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--resH:300px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#cbd5e1;background:#fafafa}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc2)}
button:disabled{opacity:.45;cursor:default}
button.on{background:#fff7ed;border-color:var(--acc);color:var(--acc);font-weight:600}
button.mini{padding:1px 7px;font-size:12px;border-radius:5px}
button.link{border:none;background:none;color:var(--sel);padding:0;text-decoration:underline}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
textarea.code,input.code{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
code,kbd{font:12px ui-monospace,Menlo,Consolas,monospace;background:#f3f4f6;border-radius:4px;padding:1px 4px}
kbd{border:1px solid #d1d5db;border-bottom-width:2px}
.mut{color:var(--mut)}
.small{font-size:12px}
.errtxt{color:var(--err)}
.warntxt{color:var(--warn)}
.oktxt{color:#047857}
#app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:16px;margin:0 6px 0 0;white-space:nowrap}
header.top h1 span{color:var(--acc)}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:none}
.tool{display:flex;align-items:center;gap:5px}
.tool svg{width:18px;height:18px}
.settings label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:3px}
.settings input{width:64px;padding:2px 4px}
.settings select{padding:2px 4px}
#modelName{border:1px solid transparent;font-weight:600;width:200px;padding:2px 6px}
#modelName:hover{border-color:var(--line)}
nav.tabs{display:flex;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:7px 14px;background:none;color:var(--mut);font-weight:600}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#fee2e2;color:var(--err);font-size:11px;margin-left:4px}
.page{flex:1;min-height:0;display:none}
.page.on{display:flex}
/* diagram page */
#pDiagram.on{display:grid}
#pDiagram{grid-template-columns:1fr 340px;grid-template-rows:1fr 6px var(--resH);min-height:0}
#canvasWrap{position:relative;min-height:0;overflow:hidden;background:#fdfdfb;background-image:radial-gradient(#e7e5e0 1px,transparent 1px);background-size:20px 20px}
#diagram{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.9);border-radius:6px;padding:3px 8px;pointer-events:none;max-width:70%}
#zoomBox{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
#splitter{grid-column:1 / 2;background:var(--line);cursor:row-resize}
#splitter:hover{background:#cbd5e1}
#inspector{grid-row:1 / 4;grid-column:2;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:12px 14px}
#results{grid-column:1;display:grid;grid-template-columns:250px 1fr;min-height:0;background:#fff}
#sliders{border-right:1px solid var(--line);overflow:auto;padding:8px 10px}
#sliders h4,#inspector h4{margin:4px 0 6px;font-size:13px}
.sl{margin:0 0 8px}
.sl .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.sl .h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl input[type=number]{width:74px;padding:1px 4px;font-size:12px;text-align:right}
.sl input[type=range]{width:100%;margin:0;accent-color:var(--acc)}
.sl.estd b::after{content:" ●";color:var(--acc);font-size:10px}
#out{display:flex;flex-direction:column;min-height:0}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 6px;align-items:center;flex-wrap:wrap}
.subtabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:5px 10px;color:var(--mut);font-weight:600;font-size:13px}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.subtabs .sp{flex:1}
.pane{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:none}
.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.cbox h5{margin:0 0 2px;font-size:13px}
.cbox h5 i{font-style:normal;font-weight:400;color:var(--mut)}
canvas.ch{width:100%;display:block}
.runerr{background:#fef2f2;border:1px solid #fecaca;color:var(--err);border-radius:8px;padding:6px 10px;margin:0 0 8px;font-size:13px}
table.tbl{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:right;white-space:nowrap}
table.tbl th{position:sticky;top:0;background:#fff;font-weight:600}
table.tbl td:first-child,table.tbl th:first-child{text-align:left}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.row label{font-size:12px;color:var(--mut)}
/* inspector */
.ifield{margin:0 0 10px}
.ifield>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}
.ifield input[type=text],.ifield textarea,.ifield select{width:100%}
.ifield textarea.code{min-height:58px;resize:vertical}
.typebadge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:5px;background:#f3f4f6;color:#374151;margin-bottom:6px}
.typebadge.stock{background:#dbeafe;color:#1e40af}.typebadge.flow{background:#dcfce7;color:#166534}.typebadge.aux{background:#f3e8ff;color:#6b21a8}.typebadge.const{background:#fef3c7;color:#92400e}
.msg{font-size:12px;border-radius:6px;padding:4px 8px;margin:4px 0}
.msg.err{background:#fef2f2;color:var(--err)}
.msg.warn{background:#fffbeb;color:#92400e}
.msg.ok{background:#f0fdf4;color:#166534}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fcfcfb}
.box>b{display:block;font-size:12px;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 label,.grid3 label{font-size:11px;color:var(--mut);display:block}
.grid2 input,.grid2 select,.grid3 input,.grid3 select{width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.inchips .chip{font-family:ui-monospace,Menlo,Consolas,monospace}
/* svg diagram */
.st rect{fill:#fff;stroke:#1f2933;stroke-width:1.6}
.st.sel rect,.ax.sel circle,.fl.sel .valve{stroke:var(--sel);stroke-width:2.6}
.st.err rect,.ax.err circle,.fl.err .valve{stroke:var(--err);stroke-dasharray:4 2}
.hl rect,.hl circle,.hl .valve{fill:#fff7ed!important;stroke:var(--acc)!important;stroke-width:2.6!important}
.ax circle{fill:#fff;stroke:#4b5563;stroke-width:1.4}
.ax.const circle{fill:#fffbeb;stroke:#b45309}
.lbl{font-size:12px;fill:#1f2933;pointer-events:none}
.lbl.st{font-weight:600;font-size:12.5px}
.pipe-o{stroke:#1f2933;stroke-width:8;fill:none}
.pipe-i{stroke:#fff;stroke-width:4.4;fill:none}
.fl.hl .pipe-o{stroke:var(--acc)}
.valve{fill:#fff;stroke:#1f2933;stroke-width:1.5}
.cloud{fill:#fff;stroke:#6b7280;stroke-width:1.3}
.lk{fill:none;stroke:#6b7280;stroke-width:1.3}
.lk.sel{stroke:var(--sel);stroke-width:2.2}
.lk.hl{stroke:var(--acc);stroke-width:2.4}
.lkhit{fill:none;stroke:transparent;stroke-width:12}
.pol{font-size:13px;font-weight:700;pointer-events:none}
.pol.p{fill:#047857}.pol.n{fill:#b91c1c}.pol.z{fill:#9ca3af}
.handle{fill:#fff;stroke:var(--sel);stroke-width:1.5;cursor:move}
.preview{stroke:var(--sel);stroke-dasharray:5 4;fill:none;stroke-width:1.6}
.gbadge{font-size:9px;font-weight:700;fill:#92400e}
.loopTag{font-size:11px;font-weight:700}
/* full pages */
.scroll{flex:1;overflow:auto;padding:14px 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:15px}
.wrap{max-width:1300px;margin:0 auto}
table.eqs{width:100%;border-collapse:collapse;font-size:13px}
table.eqs th{text-align:left;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);padding:4px 6px}
table.eqs td{border-bottom:1px solid #f1f1ef;padding:3px 6px;vertical-align:top}
table.eqs input{width:100%}
table.eqs td.nm{font-weight:600;white-space:nowrap}
table.godley{border-collapse:collapse;font-size:13px}
table.godley th,table.godley td{border:1px solid var(--line);padding:3px 4px;vertical-align:middle}
table.godley th{background:#faf9f6}
table.godley input.cell{width:150px}
table.godley input.lab{width:150px;font-weight:600}
table.godley td.sum{min-width:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table.godley tr.kind td,table.godley tr.init td{background:#fcfcfb}
table.godley .A{color:#1e40af}.godley .L{color:#991b1b}.godley .E{color:#166534}
.est{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.est{grid-template-columns:1fr}}
.est textarea{width:100%;height:120px}
.bar{height:7px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff}
.stat span{display:block;font-size:11px;color:var(--mut)}
.stat b{font-size:17px}
.stat.ok{border-left:4px solid #059669}.stat.warn{border-left:4px solid #d97706}
.help h2{font-size:17px;margin:18px 0 6px}
.help h3{font-size:14px;margin:12px 0 4px}
.help p,.help li{max-width:880px}
.help table{border-collapse:collapse;font-size:13px}
.help td,.help th{border-bottom:1px solid var(--line);padding:4px 10px 4px 0;text-align:left;vertical-align:top}
.menu{position:relative}
.menu .dd{display:none;position:absolute;top:100%;left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;min-width:250px}
.menu.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;border:none;padding:6px 10px}
.dd button small{display:block;color:var(--mut)}
.dd hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.on{opacity:.95}
.gfed{border:1px solid var(--line);border-radius:6px;background:#fff;cursor:crosshair}
#report{display:none}
@media print{
  body{overflow:visible;background:#fff}
  #app{display:none}
  #report{display:block;padding:0 6mm;font-size:11pt}
  #report h1{font-size:18pt;margin:0 0 4pt}
  #report h2{font-size:13pt;margin:14pt 0 4pt;border-bottom:1px solid #999}
  #report table{border-collapse:collapse;font-size:9pt;width:100%}
  #report td,#report th{border-bottom:1px solid #ddd;padding:2pt 4pt;text-align:left;vertical-align:top}
  #report img{max-width:100%}
  #report .pg{page-break-inside:avoid}
}

</style>
</head>
<body>
<div id="app">
<header class="top">
  <h1>Cafe <span>Dynamics</span> Studio</h1>
  <div class="grp">
    <div class="menu" id="mFile"><button id="bFile">File ▾</button>
      <div class="dd">
        <button data-act="new">New empty model</button>
        <button data-act="open">Open… <small>.json (this app), .stmx / .xmile / .itmx (Stella, XMILE), .mdl (Vensim)</small></button>
        <button data-act="save">Save model (.json)</button>
        <button data-act="exportcsv">Export run as CSV</button>
        <button data-act="print">Print report / save as PDF</button>
      </div>
    </div>
    <div class="menu" id="mEx"><button id="bEx">Examples ▾</button><div class="dd" id="exList"></div></div>
    <input type="file" id="fileIn" accept=".json,.stmx,.xmile,.itmx,.xmi,.xml,.mdl" hidden>
  </div>
  <input type="text" id="modelName" title="Model name">
  <div class="grp">
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  </div>
  <div class="grp" id="tools">
    <button class="tool on" data-tool="select" title="Select and move (Esc)"><svg viewBox="0 0 20 20"><path d="M4 2l11 8-5 1 3 6-2 1-3-6-4 3z" fill="currentColor"/></svg>Select</button>
    <button class="tool" data-tool="stock" title="Stock: click on the canvas (S)"><svg viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Stock</button>
    <button class="tool" data-tool="flow" title="Flow: drag from a stock or empty space to a stock or empty space (F)"><svg viewBox="0 0 20 20"><path d="M1 10h15" stroke="currentColor" stroke-width="4"/><path d="M1 10h15" stroke="#fff" stroke-width="1.6"/><path d="M14 6l5 4-5 4z" fill="currentColor"/><circle cx="8" cy="10" r="3" fill="#fff" stroke="currentColor"/></svg>Flow</button>
    <button class="tool" data-tool="aux" title="Variable or constant: click on the canvas (V)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Variable</button>
    <button class="tool" data-tool="link" title="Link (information arrow): drag from one variable to another (L)"><svg viewBox="0 0 20 20"><path d="M3 15Q8 3 15 7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 3l4 5-6 1z" fill="currentColor"/></svg>Link</button>
  </div>
  <div class="grp settings">
    <label>Start <input type="number" id="sStart" step="any"></label>
    <label>Stop <input type="number" id="sStop" step="any"></label>
    <label>DT <input type="number" id="sDt" step="any" min="0"></label>
    <label><select id="sMethod"><option value="rk4">RK4</option><option value="euler">Euler</option></select></label>
    <label>Time unit <input type="text" id="sUnit" style="width:60px"></label>
  </div>
  <div class="grp"><span id="runState" class="small mut"></span></div>
</header>
<nav class="tabs" id="tabs">
  <button data-page="pDiagram" class="on">Diagram</button>
  <button data-page="pEqs">Equations</button>
  <button data-page="pGodley">Godley tables</button>
  <button data-page="pEst">Estimation</button>
  <button data-page="pHelp">Help</button>
</nav>
<section class="page on" id="pDiagram">
  <div id="canvasWrap">
    <svg id="diagram"></svg>
    <div id="hint"></div>
    <div id="zoomBox"><button class="mini" id="zIn">+</button><button class="mini" id="zOut">−</button><button class="mini" id="zFit">Fit</button></div>
  </div>
  <div id="inspector"></div>
  <div id="splitter" title="Drag to resize"></div>
  <div id="results">
    <div id="sliders"></div>
    <div id="out">
      <div class="subtabs" id="subtabs">
        <button data-pane="qGraph" class="on">Graphs</button>
        <button data-pane="qTable">Table</button>
        <button data-pane="qPhase">Phase plot</button>
        <button data-pane="qLoops">Loops</button>
        <button data-pane="qStab">Stability</button>
        <button data-pane="qSens">Sensitivity</button>
        <button data-pane="qProb">Problems <span id="probBadge"></span></button>
        <span class="sp"></span>
        <button class="mini" id="bPin" title="Keep a grey copy of this run for comparison">Pin run</button>
        <button class="mini" id="bUnpin">Clear pins</button>
      </div>
      <div class="pane on" id="qGraph"></div>
      <div class="pane" id="qTable"></div>
      <div class="pane" id="qPhase"></div>
      <div class="pane" id="qLoops"></div>
      <div class="pane" id="qStab"></div>
      <div class="pane" id="qSens"></div>
      <div class="pane" id="qProb"></div>
    </div>
  </div>
</section>
<section class="page" id="pEqs"><div class="scroll"><div class="wrap" id="eqsBody"></div></div></section>
<section class="page" id="pGodley"><div class="scroll"><div class="wrap" id="godBody"></div></div></section>
<section class="page" id="pEst"><div class="scroll"><div class="wrap" id="estBody"></div></div></section>
<section class="page" id="pHelp"><div class="scroll"><div class="wrap help" id="helpBody"></div></div></section>
</div>
<div id="toast"></div>
<div id="report"></div>

<script id="engine-src">
"use strict";
// ===== Sampler core: NUTS with dense-metric adaptation (verbatim from Cafe Structural Studio) =====
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeNormal(rng){
  let spare = null;
  return function(){
    if (spare !== null){ const s = spare; spare = null; return s; }
    const u = 1 - rng(), v = rng();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
}
function log1pexp(x){ return x > 0 ? x + Math.log1p(Math.exp(-x)) : Math.log1p(Math.exp(x)); }
function zeros(r, c){ const a = []; for (let i = 0; i < r; i++) a.push(new Float64Array(c)); return a; }

// ---------- dense metric + NUTS (generic in the model) ----------
function chol(S, d){
  const Lm = zeros(d, d);
  for (let i = 0; i < d; i++){
    for (let j = 0; j <= i; j++){
      let sum = S[i][j];
      for (let k = 0; k < j; k++) sum -= Lm[i][k] * Lm[j][k];
      if (i === j){ if (!(sum > 1e-14)) return null; Lm[i][i] = Math.sqrt(sum); }
      else Lm[i][j] = sum / Lm[j][j];
    }
  }
  return Lm;
}
function makeMetric(d){
  const S = zeros(d, d), Lc = zeros(d, d);
  for (let i = 0; i < d; i++){ S[i][i] = 1; Lc[i][i] = 1; }
  return { S, Lc, d };
}
function adaptMetric(met, win){
  const n = win.length, d = met.d;
  if (n < 10) return;
  const mean = new Float64Array(d);
  for (const w of win) for (let i = 0; i < d; i++) mean[i] += w[i] / n;
  const cov = zeros(d, d);
  for (const w of win) for (let i = 0; i < d; i++) for (let j = 0; j <= i; j++)
    cov[i][j] += (w[i] - mean[i]) * (w[j] - mean[j]) / (n - 1);
  const S = zeros(d, d);
  for (let i = 0; i < d; i++) for (let j = 0; j <= i; j++){
    const v = (n / (n + 5)) * cov[i][j] + (i === j ? 1e-3 * (5 / (n + 5)) : 0);
    S[i][j] = v; S[j][i] = v;
  }
  let Lc = chol(S, d);
  if (!Lc){
    Lc = zeros(d, d);
    for (let i = 0; i < d; i++){ const v = S[i][i]; for (let j = 0; j < d; j++) if (i !== j) S[i][j] = 0; Lc[i][i] = Math.sqrt(v); }
  }
  met.S = S; met.Lc = Lc;
}
function sampleMomentum(met, nrm){
  const d = met.d, z = new Float64Array(d), p = new Float64Array(d);
  for (let i = 0; i < d; i++) z[i] = nrm();

function exBuild(name, settings, spec, extra){
  let n = 0; const id = () => 'e' + (++n);
  const vars = [], links = [], byName = {};
  for (const s of spec.vars){
    const v = Object.assign({ id: id(), type: s[0], name: s[1], eq: s[2], x: s[3], y: s[4], units: '', doc: '' }, s[5] || {});
    vars.push(v); byName[v.name] = v;
  }
  for (const v of vars) if (v.type === 'flow'){
    if (v.from && byName[v.from]) v.from = byName[v.from].id; else { v.from = null; }
    if (v.to && byName[v.to]) v.to = byName[v.to].id; else { v.to = null; }
  }
  for (const l of spec.links || []){ if (byName[l[0]] && byName[l[1]]) links.push({ id: id(), from: byName[l[0]].id, to: byName[l[1]].id, bend: l[2] || 0 }); }
  const godley = (spec.godley || []).map(t => ({ id: id(), name: t.name,
    cols: t.cols.map(c => ({ stock: byName[c[0]].id, kind: c[1] })),
    rows: t.rows.map(r => { const cells = {}; Object.entries(r[1]).forEach(([k, e]) => { cells[byName[k].id] = e; }); return { label: r[0], cells }; }) }));
  return Object.assign({ format: 'cafe-dynamics', version: 1, name, notes: spec.notes || '', settings: Object.assign({ start: 0, stop: 100, dt: 0.25, method: 'rk4', timeUnit: 'year', seed: 1 }, settings), vars, links, godley, est: spec.est || {}, ui: spec.ui || {} }, extra || {});
}

// ---------- compile + run ----------
function linkWarnings(){
  const out = [], m = App.model;
  const has = (a, b) => m.links.some(l => l.from === a && l.to === b);
  for (const v of m.vars){
    if (v.type === 'stock' && !v.eq) continue;
    const refs = refsOfSource(v.eq);
    for (const k of refs){
      const u = varByKey(k); if (!u || u.id === v.id) continue;
      if (!has(u.id, v.id)) out.push({ id: v.id, msg: '"' + v.name + '" uses "' + u.name + '" but there is no link arrow from it', missing: [u.id, v.id] });
    }
  }
  for (const l of m.links){
    const a = varById(l.from), b = varById(l.to); if (!a || !b) continue;
    if (!refsOfSource(b.eq).has(keyOf(a.name))) out.push({ id: b.id, msg: 'Link from "' + a.name + '" to "' + b.name + '" is not used in the equation of ' + b.name, unused: l.id });
  }
  return out;
}
function compileAndRun(){
  const t0 = performance.now();

  catch (e){ cm = { ok: false, errors: [{ id: null, msg: 'Internal error: ' + e.message }], warnings: [] }; console.error(e); }
  App.errById = new Map();
  for (const e of cm.errors) if (e.id) App.errById.set(e.id, e.msg);
  App.warnings = (cm.warnings || []).concat(linkWarnings());
  App.cm = cm.ok ? cm : null;
  App.compileErrors = cm.errors;
  if (cm.ok){
    try { App.run = simulate(cm, {}); App.runError = App.run.error; }
    catch (e){ App.run = null; App.runError = e.message; }
  } else { App.run = null; App.runError = null; }

}

// ---------- geometry ----------
function flowEnds(f){
  const from = f.from && varById(f.from), to = f.to && varById(f.to);
  let a = from ? { x: from.x, y: from.y } : { x: f.x1 ?? (f.x - 80), y: f.y1 ?? f.y };
  let b = to ? { x: to.x, y: to.y } : { x: f.x2 ?? (f.x + 80), y: f.y2 ?? f.y };
  // straighten flows that connect to a stock on one side only, if nearly level or vertical
  if (from) a = rectExit(from, b);
  if (to) b = rectExit(to, a);
  return { a, b };
}
function rectExit(s, p){
  const dx = p.x - s.x, dy = p.y - s.y, hw = STOCK_W / 2, hh = STOCK_H / 2;

  return { x: s.x + dx * t, y: s.y + dy * t };
}
function valvePos(f){ const { a, b } = flowEnds(f); return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function anchor(v){ return v.type === 'flow' ? valvePos(v) : { x: v.x, y: v.y }; }
function insideShape(v, p, pad){
  pad = pad || 0;

  if (v.type === 'stock') return Math.abs(p.x - c.x) <= STOCK_W / 2 + pad && Math.abs(p.y - c.y) <= STOCK_H / 2 + pad;
  const r = v.type === 'flow' ? VALVE_R + 3 : AUX_R;
  return Math.hypot(p.x - c.x, p.y - c.y) <= r + pad;
}
function linkGeom(l){
  const a = varById(l.from), b = varById(l.to);
  if (!a || !b) return null;
  const P0 = anchor(a), P2 = anchor(b);
  const mx = (P0.x + P2.x) / 2, my = (P0.y + P2.y) / 2, dx = P2.x - P0.x, dy = P2.y - P0.y, len = Math.hypot(dx, dy) || 1;
  let bend = l.bend || 0;
  if (a.type === 'stock' && b.type === 'flow' && (b.from === a.id || b.to === a.id)) bend = (bend < 0 ? -1 : 1) * Math.max(Math.abs(bend), 42);
  const P1 = { x: mx - dy / len * bend * 2, y: my + dx / len * bend * 2 };
  const B = t => ({ x: (1 - t) * (1 - t) * P0.x + 2 * (1 - t) * t * P1.x + t * t * P2.x, y: (1 - t) * (1 - t) * P0.y + 2 * (1 - t) * t * P1.y + t * t * P2.y });
  let t0 = 0, t1 = 1;
  for (let i = 0; i <= 60; i++){ const t = i / 60; if (!insideShape(a, B(t), 2)){ t0 = t; break; } }
  for (let i = 60; i >= 0; i--){ const t = i / 60; if (!insideShape(b, B(t), 3)){ t1 = t; break; } }
  if (t1 <= t0){ t0 = 0; t1 = 1; }
  const bl = (u, v) => ({ x: (1 - u) * (1 - v) * P0.x + ((1 - u) * v + u * (1 - v)) * P1.x + u * v * P2.x, y: (1 - u) * (1 - v) * P0.y + ((1 - u) * v + u * (1 - v)) * P1.y + u * v * P2.y });

}
function arrowHead(E, from, size){
  const dx = E.x - from.x, dy = E.y - from.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  size = size || 9;
  const bx = E.x - ux * size, by = E.y - uy * size;
  return `M${E.x},${E.y}L${bx - uy * size * 0.45},${by + ux * size * 0.45}L${bx + uy * size * 0.45},${by - ux * size * 0.45}Z`;
}
function cloudPath(x, y){

}
function wrapLabel(name, max){
  const words = prettyName(name).split(' '), lines = []; let cur = '';

const isConstVar = v => v.type === 'aux' && !v.graph && /^\s*-?\s*(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?\s*$/.test(v.eq || '');

// ===== UI: charts and panels =====
function niceTicks(lo, hi, n){
  if (!isFinite(lo) || !isFinite(hi)) return [];
  if (hi === lo){ hi = lo + 1; }
  const span = hi - lo, step0 = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
// cfg: {series:[{x,y,color,width,dash,label}], bands:[{x,lo,hi,color}], dots:[{x,y,color,label}], h, xy, xlab, ylab, compact, ymin, ymax, vline}
function lineChart(cv, cfg){
  const dpr = window.devicePixelRatio || 1, W = Math.max(120, cv.clientWidth || cv.parentElement.clientWidth || 400), H = cfg.h || 200;
  cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv._cfg = cfg; cv._W = W; cv._H = H;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const scan = (xs, ys) => { for (let i = 0; i < xs.length; i++){ const x = xs[i], y = ys[i]; if (isFinite(x) && isFinite(y)){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } } };
  for (const s of cfg.series || []) scan(s.x, s.y);
  for (const b of cfg.bands || []){ scan(b.x, b.lo); scan(b.x, b.hi); }
  for (const d of cfg.dots || []) scan(d.x, d.y);
  if (!isFinite(x0)){ g.fillStyle = '#9ca3af'; g.font = '12px system-ui'; g.fillText('no data', 10, 20); return; }
  if (cfg.ymin != null) y0 = Math.min(y0, cfg.ymin);
  if (cfg.ymax != null) y1 = Math.max(y1, cfg.ymax);
  if (y1 - y0 < 1e-12 * Math.max(1, Math.abs(y1))){ const c = y0; y0 = c - (Math.abs(c) * 0.1 || 1); y1 = c + (Math.abs(c) * 0.1 || 1); }
  else { const p = (y1 - y0) * 0.05; y0 -= p; y1 += p; }
  if (cfg.xy){ const p = (x1 - x0) * 0.05 || 1; x0 -= p; x1 += p; }
  if (x1 === x0) x1 = x0 + 1;
  const labeled = (cfg.series || []).filter(s => s.label && !s.nolegend);
  const legendH = labeled.length >= 2 && !cfg.compact ? 18 : 0;
  const m = { l: 52, r: 20, t: 8 + legendH, b: cfg.compact ? 20 : (cfg.xlab ? 34 : 22) };
  cv._m = m; cv._sc = { x0, x1, y0, y1 };
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = y => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  cv._X = X; cv._Y = Y;
  g.font = '11px system-ui'; g.lineWidth = 1;
  const yt = niceTicks(y0, y1, cfg.compact ? 3 : 5), xt = niceTicks(x0, x1, Math.max(3, Math.floor((W - 60) / 80)));
  g.strokeStyle = '#eceae6'; g.fillStyle = '#6b7280';
  for (const y of yt){ g.beginPath(); g.moveTo(m.l, Y(y)); g.lineTo(W - m.r, Y(y)); g.stroke(); g.textAlign = 'right'; g.fillText(niceNum(y), m.l - 6, Y(y) + 3.5); }
  g.textAlign = 'center';
  for (const x of xt){ g.fillText(niceNum(x), X(x), H - m.b + 14); }
  g.strokeStyle = '#d1d5db'; g.beginPath(); g.moveTo(m.l, H - m.b); g.lineTo(W - m.r, H - m.b); g.stroke();
  if (cfg.xlab && !cfg.compact){ g.fillStyle = '#6b7280'; g.fillText(cfg.xlab, (m.l + W - m.r) / 2, H - 4); }
  if (cfg.ylab && !cfg.compact){ g.save(); g.translate(11, (m.t + H - m.b) / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillText(cfg.ylab, 0, 0); g.restore(); }
  if (cfg.vline != null && cfg.vline >= x0 && cfg.vline <= x1){ g.strokeStyle = '#d1d5db'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(cfg.vline), m.t); g.lineTo(X(cfg.vline), H - m.b); g.stroke(); g.setLineDash([]); }
  for (const b of cfg.bands || []){
    g.fillStyle = b.color; g.beginPath(); let started = false;
    for (let i = 0; i < b.x.length; i++){ if (!isFinite(b.hi[i])) continue; const px = X(b.x[i]), py = Y(b.hi[i]); if (!started){ g.moveTo(px, py); started = true; } else g.lineTo(px, py); }
    for (let i = b.x.length - 1; i >= 0; i--){ if (!isFinite(b.lo[i])) continue; g.lineTo(X(b.x[i]), Y(b.lo[i])); }
    g.closePath(); g.fill();
  }
  g.save(); g.beginPath(); g.rect(m.l, m.t - 2, W - m.l - m.r, H - m.t - m.b + 4); g.clip();

    g.strokeStyle = s.color; g.lineWidth = s.width || 2; g.setLineDash(s.dash || []); g.lineJoin = 'round';
    g.beginPath(); let pen = false;
    const n = s.x.length, stepI = n > 4 * W ? Math.floor(n / (2 * W)) : 1;
    for (let i = 0; i < n; i += stepI){ const y = s.y[i]; if (!isFinite(y)){ pen = false; continue; } const px = X(s.x[i]), py = Y(y); if (pen) g.lineTo(px, py); else { g.moveTo(px, py); pen = true; } }
    if (stepI > 1 && isFinite(s.y[n - 1])) g.lineTo(X(s.x[n - 1]), Y(s.y[n - 1]));
    g.stroke(); g.setLineDash([]);
    if (s.startDot && n){ g.fillStyle = s.color; g.beginPath(); g.arc(X(s.x[0]), Y(s.y[0]), 4.5, 0, 7); g.fill(); }
  }
  for (const d of cfg.dots || []){
    g.fillStyle = d.color || '#1f2933';
    for (let i = 0; i < d.x.length; i++){ if (!isFinite(d.y[i])) continue; g.beginPath(); g.arc(X(d.x[i]), Y(d.y[i]), d.r || 2.6, 0, 7); g.fill(); }
  }
  g.restore();
  if (legendH){
    let lx = m.l; g.textAlign = 'left'; g.font = '11px system-ui';
    for (const s of labeled){
      g.strokeStyle = s.color; g.lineWidth = 2; g.setLineDash(s.dash || []); g.beginPath(); g.moveTo(lx, 10); g.lineTo(lx + 16, 10); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#374151'; const t = prettyName(s.label); g.fillText(t, lx + 20, 14); lx += 30 + g.measureText(t).width;
      if (lx > W - 60) break;
    }
  }
  if (!cv._hover){
    cv._hover = true;
    cv.addEventListener('mousemove', e => chartHover(cv, e));
    cv.addEventListener('mouseleave', () => { if (cv._cfg) lineChart(cv, cv._cfg); });
  }
}
function chartHover(cv, e){
  const cfg = cv._cfg; if (!cfg) return;
  lineChart(cv, cfg);
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, m = cv._m, W = cv._W, H = cv._H;
  if (px < m.l || px > W - m.r || py < m.t || py > H - m.b) return;
  const g = cv.getContext('2d'), sc = cv._sc, X = cv._X, Y = cv._Y;
  const rows = [];
  let xv;
  if (cfg.xy){
    let best = null, bd = 400;
    for (const s of cfg.series){ for (let i = 0; i < s.x.length; i += Math.max(1, Math.floor(s.x.length / 2000))){ const d = (X(s.x[i]) - px) ** 2 + (Y(s.y[i]) - py) ** 2; if (d < bd){ bd = d; best = { s, i }; } } }
    if (!best) return;
    const { s, i } = best;
    g.fillStyle = s.color; g.beginPath(); g.arc(X(s.x[i]), Y(s.y[i]), 4, 0, 7); g.fill();
    rows.push([null, (cfg.xlab || 'x') + ' ' + niceNum(s.x[i])], [null, (cfg.ylab || 'y') + ' ' + niceNum(s.y[i])]);
    if (s.t) rows.unshift([null, 'time ' + niceNum(s.t[i])]);
  } else {
    xv = sc.x0 + (px - m.l) / (W - m.l - m.r) * (sc.x1 - sc.x0);
    g.strokeStyle = '#9ca3af'; g.lineWidth = 1; g.beginPath(); g.moveTo(px, m.t); g.lineTo(px, H - m.b); g.stroke();
    rows.push([null, (cfg.xlab || 'time') + ' ' + niceNum(xv)]);
    const at = (xs, ys) => { let lo = 0, hi = xs.length - 1; if (xv <= xs[0]) return ys[0]; if (xv >= xs[hi]) return ys[hi]; while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (xs[mid] <= xv) lo = mid; else hi = mid; } const f = (xv - xs[lo]) / (xs[hi] - xs[lo]); return ys[lo] + f * (ys[hi] - ys[lo]); };

      g.fillStyle = '#fff'; g.strokeStyle = s.color; g.lineWidth = 2; g.beginPath(); g.arc(px, Y(y), 3.5, 0, 7); g.fill(); g.stroke();
      if (!s.nolegend) rows.push([s.color, prettyName(s.label || '') + '  ' + niceNum(y)]); }
    for (const b of cfg.bands || []){ if (b.label && xv >= b.x[0] && xv <= b.x[b.x.length - 1]) rows.push([null, b.label + ' ' + niceNum(at(b.x, b.lo)) + ' – ' + niceNum(at(b.x, b.hi))]); }
  }
  g.font = '11px system-ui';
  const w = Math.max(...rows.map(r => g.measureText(r[1]).width)) + (rows.some(r => r[0]) ? 26 : 14), h = rows.length * 15 + 8;
  let bx = px + 12, by = Math.max(m.t, py - h - 6); if (bx + w > W - 2) bx = px - w - 12;
  g.fillStyle = 'rgba(255,255,255,.96)'; g.strokeStyle = '#d1d5db'; g.lineWidth = 1; g.beginPath(); g.roundRect ? g.roundRect(bx, by, w, h, 6) : g.rect(bx, by, w, h); g.fill(); g.stroke();
  rows.forEach((r, i) => {
    let tx = bx + 7;
    if (r[0]){ g.strokeStyle = r[0]; g.lineWidth = 2.5; g.beginPath(); g.moveTo(tx, by + 12 + i * 15); g.lineTo(tx + 10, by + 12 + i * 15); g.stroke(); tx += 15; }
    g.fillStyle = i === 0 ? '#6b7280' : '#1f2933'; g.textAlign = 'left'; g.fillText(r[1], tx, by + 16 + i * 15);
  });
}
function defaultGraph(){

      <p class="small mut">A <b>reinforcing (R)</b> loop amplifies change; a <b>balancing (B)</b> loop counteracts it. Polarity is measured at the chosen time, so it can change as the system moves. Click a loop to light it up in the diagram.</p>`;

      const pts = [...ids].map(id => anchor(varById(id)));

      const same = App.hl && App.hl.loop === lp.tag;
      App.hl = same ? null : { vars: ids, links, loop: lp.tag, tag: { x: cx, y: cy, text: lp.tag.startsWith('R') ? '⟳ ' + lp.tag : lp.tag.startsWith('B') ? '⟲ ' + lp.tag : '?', color: lp.tag.startsWith('R') ? '#047857' : '#b91c1c' } };

  stability(){
    const box = $('qStab'), cm = App.cm, run = App.run;
    if (!cm || !run){ box.innerHTML = this.runErrHtml() || '<p class="mut small">No run yet.</p>'; return; }
    const st = cm.stocks;
    if (!st.length){ box.innerHTML = '<p class="small">The model has no stocks.</p>'; return; }
    let h = `<div class="row"><label>Start the search from <select id="sbFrom"><option value="end">the end of the run</option><option value="start">the start of the run</option></select></label>
      <button class="mini primary" id="sbGo">Find equilibrium</button><button class="mini" id="sbHere">Linearize at end of run (no search)</button></div>
      <p class="small mut">An equilibrium is where every stock stops changing. Its eigenvalues tell you what happens near it: negative real parts damp, positive real parts amplify, imaginary parts mean cycles.${cm.timeDependent ? ' <span class="warntxt">This model uses TIME, STEP, PULSE or random inputs; they are frozen at the chosen time.</span>' : ''}</p><div id="sbOut"></div>`;
    box.innerHTML = h;
    const go = search => {
      const fromEnd = $('sbFrom').value === 'end', idx = fromEnd ? run.n - 1 : 0, t = run.t[idx];
      const s0 = Float64Array.from(st.map(v => run.V[v.vi][idx]));
      const E = { dt: run.dt, start: run.start, stop: run.stop };
      let res = { ok: true, s: s0, msg: '' };
      if (search) res = findEquilibrium(cm, run.c, s0, t, E);
      const J = jacobian(stateDeriv(cm, run.c, t, E), res.s);
      const ev = st.length <= 12 ? eigenvalues(J) : null;
      let o = '';
      if (search) o += res.ok ? '<div class="msg ok">Equilibrium found.</div>' : `<div class="msg warn">${esc(res.msg)} Showing the last point reached.</div>`;
      o += '<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start"><table class="tbl"><thead><tr><th>Stock</th><th>' + (search ? 'equilibrium' : 'value') + '</th>' + (search ? '<th>at chosen start</th>' : '') + '</tr></thead><tbody>';
      st.forEach((v, i) => { if (v.hidden) return; o += `<tr><td>${esc(prettyName(v.name))}</td><td>${niceNum(res.s[i])}</td>${search ? `<td>${niceNum(s0[i])}</td>` : ''}</tr>`; });
      o += '</tbody></table>';
      if (ev){
        o += '<table class="tbl"><thead><tr><th>Eigenvalue</th><th>real</th><th>imag</th><th>period</th><th>half-life / doubling</th></tr></thead><tbody>';
        ev.forEach((e, i) => { const per = Math.abs(e[1]) > 1e-9 ? niceNum(2 * Math.PI / Math.abs(e[1])) : '–'; const hl = Math.abs(e[0]) > 1e-9 ? niceNum(Math.LN2 / Math.abs(e[0])) + (e[0] < 0 ? ' (half-life)' : ' (doubling)') : '–'; o += `<tr><td>λ${i + 1}</td><td>${niceNum(e[0])}</td><td>${niceNum(e[1])}</td><td>${per}</td><td>${hl}</td></tr>`; });
        o += `</tbody></table></div><p><b>${esc(classify(ev))}</b></p>`;
        if (st.some(v => v.hidden)) o += '<p class="small mut">Includes the hidden stocks created by SMOOTH / DELAY functions.</p>';
      } else o += '</div><p class="small">Too many stocks for the eigenvalue calculator (limit 12).</p>';
      $('sbOut').innerHTML = o;
    };
    $('sbGo').onclick = () => go(true);
    $('sbHere').onclick = () => go(false);
  },
  sensUI(){
    const box = $('qSens'), cm = App.cm;
    const cs = App.model.vars.filter(isConstVar), vs = App.model.vars.filter(v => !isConstVar(v));
    if (!cm){ box.innerHTML = this.runErrHtml(); return; }
    if (!cs.length){ box.innerHTML = '<p class="small">Add a constant to run a sensitivity analysis.</p>'; return; }
    const S = App.model.ui.sens || {};
    const c0 = cs.find(v => v.id === S.c) || cs[0], r = sliderRange(c0), out = vs.find(v => v.id === S.v) || vs.find(v => v.type === 'stock') || vs[0];
    box.innerHTML = `<div class="row"><label>Vary <select id="seC">${cs.map(v => `<option value="${v.id}" ${v === c0 ? 'selected' : ''}>${esc(prettyName(v.name))}</option>`).join('')}</select></label>
      <label>from <input type="number" step="any" id="seLo" value="${S.lo ?? r.min}" style="width:80px"></label><label>to <input type="number" step="any" id="seHi" value="${S.hi ?? r.max}" style="width:80px"></label>
      <label>runs <input type="number" id="seN" value="${S.n || 9}" min="2" max="40" style="width:56px"></label>
      <label>show <select id="seV">${vs.map(v => `<option value="${v.id}" ${v === out ? 'selected' : ''}>${esc(prettyName(v.name))}</option>`).join('')}</select></label>
      <button class="mini primary" id="seGo">Run</button></div><canvas class="ch" id="seC_"></canvas><div class="small mut" id="seNote"></div>`;
    const goS = () => {
      const c = varById($('seC').value), v = varById($('seV').value), lo = parseFloat($('seLo').value), hi = parseFloat($('seHi').value), n = Math.max(2, Math.min(40, parseInt($('seN').value) || 9));
      App.model.ui.sens = { c: c.id, v: v.id, lo, hi, n }; saveLocal();
      const cc = cm.byKey.get(keyOf(c.name)), vv = cm.byKey.get(keyOf(v.name));
      if (!cc || !vv) return;
      const series = []; let fails = 0;
      // sequential light-to-dark ramp of one hue (magnitude of the varied constant)
      const ramp = t => { const a = [214, 232, 250], b = [16, 62, 132]; return `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * (0.25 + 0.75 * t))).join(',')})`; };
      for (let i = 0; i < n; i++){
        const x = lo + (hi - lo) * i / (n - 1), cv = Float64Array.from(cm.cvals); cv[cc.ci] = x;
        try { const run = simulate(cm, { c: cv }); if (run.error) fails++; series.push({ x: run.t, y: run.V[vv.vi], color: ramp(i / (n - 1)), width: 1.6, label: c.name + ' = ' + niceNum(x), nolegend: true }); } catch (e){ fails++; }
      }
      lineChart($('seC_'), { series, h: Math.max(200, box.clientHeight - 70), xlab: App.model.settings.timeUnit || 'time' });
      $('seNote').innerHTML = `Light blue = ${esc(c.name)} at ${niceNum(lo)}, dark blue = ${niceNum(hi)}. Hover for values.${fails ? ` <span class="warntxt">${fails} run(s) stopped early.</span>` : ''}`;
    };
    $('seGo').onclick = goS;
    if (S.c) goS();

  // sketch positions
  let placed = 0;
  if (sketch){
    const pos = {};
    for (const line of sketch.split('\n')){
      if (!line.startsWith('10,')) continue;
      const f = splitTop(line, ',');
      const name = clean(f[2] || ''), x = parseFloat(f[3]), y = parseFloat(f[4]);
      if (name && isFinite(x) && !pos[keyOf(name)]) pos[keyOf(name)] = { x, y };
    }
    for (const v of m.vars){ const p = pos[keyOf(v.name)]; if (p){ v.x = p.x; v.y = p.y; placed++; } }
    for (const f of m.vars.filter(v => v.type === 'flow' && v.x != null)){ if (!f.from){ f.x1 = f.x - 90; f.y1 = f.y; } if (!f.to){ f.x2 = f.x + 90; f.y2 = f.y; } }
  }
  if (placed < m.vars.length) autoLayout(m, placed === 0);
  addDependencyLinks(m);
  return { model: m, notes: [...new Set(notes)] };
}
function uniqueIn(vars, base){ let n = base, i = 2; while (vars.some(v => keyOf(v.name) === keyOf(n))) n = base + '_' + (i++); return n; }
function autoLayout(m, all){
  const stocks = m.vars.filter(v => v.type === 'stock'), flows = m.vars.filter(v => v.type === 'flow'), auxs = m.vars.filter(v => v.type === 'aux');
  const free = v => all || v.x == null || !isFinite(v.x);
  stocks.forEach((s, i) => { if (free(s)){ s.x = 200 + (i % 4) * 260; s.y = 160 + Math.floor(i / 4) * 300; } });
  const cnt = {};
  flows.forEach(f => {
    const a = f.from && m.vars.find(v => v.id === f.from), b = f.to && m.vars.find(v => v.id === f.to);
    const host = b || a; const k = host ? host.id : 'none'; cnt[k] = (cnt[k] || 0) + 1; const off = (cnt[k] - 1) * 70;
    if (!a && b && (all || f.x1 == null)){ f.x1 = b.x - 200; f.y1 = b.y + off; }
    if (a && !b && (all || f.x2 == null)){ f.x2 = a.x + 200; f.y2 = a.y + off; }
    if (!a && !b && (all || f.x1 == null)){ f.x1 = 100; f.y1 = 500 + off; f.x2 = 300; f.y2 = 500 + off; }
    if (free(f)){ const vp = (() => { const ea = a ? { x: a.x, y: a.y } : { x: f.x1, y: f.y1 }, eb = b ? { x: b.x, y: b.y } : { x: f.x2, y: f.y2 }; return { x: (ea.x + eb.x) / 2, y: (ea.y + eb.y) / 2 }; })(); f.x = vp.x; f.y = vp.y; }
  });
  const maxY = Math.max(200, ...stocks.map(s => s.y)) + 150;
  let i = 0; auxs.forEach(a => { if (free(a)){ a.x = 120 + (i % 7) * 140; a.y = maxY + Math.floor(i / 7) * 90; i++; } });
}
function addDependencyLinks(m){
  const has = (a, b) => m.links.some(l => l.from === a && l.to === b);
  for (const v of m.vars){
    for (const k of refsOfSource(v.eq)){ const u = m.vars.find(x => keyOf(x.name) === k); if (u && u.id !== v.id && !has(u.id, v.id)) m.links.push({ id: uid('l'), from: u.id, to: v.id, bend: 0 }); }
  }
}

// ---------- help ----------
function renderHelp(){
  $('helpBody').innerHTML = `
  <h2>Cafe Dynamics Studio</h2>
  <p>A stock-and-flow modelling environment that runs entirely inside this one file: no installation, no internet, no account. It does what students usually need from Vensim PLE, Stella or Minsky, and adds Bayesian estimation of the model's constants from data.</p>
  <h3>Five-minute start</h3><ol>
  <li>Choose <b>Stock</b> in the toolbar and click the canvas. Type a name (e.g. <code>Population</code>) and an initial value (e.g. <code>100</code>) in the Inspector on the right.</li>
  <li>Choose <b>Flow</b> and drag from empty space into the stock: an inflow from a cloud. Name it <code>births</code>.</li>
  <li>Choose <b>Variable</b> and click near the flow. Name it <code>birth_rate</code> and give it the equation <code>0.03</code>; that makes it a constant, and a slider appears under the diagram.</li>
  <li>Choose <b>Link</b> and drag from <code>Population</code> to <code>births</code>, then from <code>birth_rate</code> to <code>births</code>. Select <code>births</code> and type <code>Population * birth_rate</code>. Click the grey chips to insert names.</li>
  <li>The model runs on every change. Move the slider and watch the graph. <b>Pin run</b> keeps a grey copy for comparison.</li></ol>
  <h3>Building blocks</h3><table>
  <tr><th>Here</th><th>Vensim</th><th>Stella / iThink</th><th>Minsky</th><th>Meaning</th></tr>
  <tr><td>Stock (box)</td><td>Level, INTEG</td><td>Stock</td><td>Stock / Godley column</td><td>An accumulation: changes only through flows</td></tr>
  <tr><td>Flow (pipe and valve)</td><td>Rate</td><td>Flow</td><td>Flow</td><td>A rate per unit of time</td></tr>
  <tr><td>Variable (circle)</td><td>Auxiliary</td><td>Converter</td><td>Variable</td><td>Computed from other quantities each step</td></tr>
  <tr><td>Constant (shaded circle)</td><td>Constant</td><td>Converter with a number</td><td>Parameter</td><td>A number; gets a slider and can be estimated</td></tr>
  <tr><td>Link (thin arrow)</td><td>Arrow</td><td>Connector</td><td>Wire</td><td>Says which quantities an equation uses</td></tr>
  <tr><td>Graphical function</td><td>Lookup</td><td>Graphical function</td><td>–</td><td>A curve drawn by hand, used as a function</td></tr>
  <tr><td>Godley table</td><td>–</td><td>–</td><td>Godley table</td><td>Double-entry bookkeeping that drives the stocks</td></tr></table>
  <p>Names use letters, digits and <code>_</code> (shown as spaces on the diagram) and are not case sensitive. Renaming a variable updates every equation that uses it. A stock's rate of change is its inflows minus its outflows; you never write it by hand. Links are not required for the maths, but the Problems tab warns about missing or unused links, because a diagram that hides its dependencies hides its feedback loops.</p>
  <h3>Equations</h3><table>${FUNC_HELP.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td></tr>`).join('')}</table>
  <p>Comments can be written in braces: <code>0.05 {per year}</code>.</p>
  <h3>Running</h3>
  <p>Start, Stop and DT (the time step) sit in the toolbar. <b>RK4</b> (fourth-order Runge–Kutta) is accurate and is the default; <b>Euler</b> matches the Vensim and Stella default and shows why small DT matters. If results change when you halve DT, DT is too large.</p>
  <h3>Analysis tabs under the diagram</h3><ul>
  <li><b>Graphs / Table / Phase plot</b>: behaviour over time, numbers, and one variable against another.</li>
  <li><b>Loops</b>: every feedback loop, marked reinforcing (R) or balancing (B). Polarity is computed at a time you choose, so you can see loops switch sign as the system moves (shifting loop dominance). Click a loop to light it up.</li>
  <li><b>Stability</b>: finds an equilibrium (where all stocks stop changing) and its eigenvalues: whether the system settles, cycles or runs away, and with what period.</li>
  <li><b>Sensitivity</b>: re-runs the model across a range of one constant.</li>
  <li><b>Problems</b>: equation errors and diagram warnings, with one-click fixes for links.</li></ul>
  <h3>Godley tables (Minsky-style)</h3>
  <p>In the Godley tables tab, each column is a stock marked Asset, Liability or Equity, and each row is a transaction. Type the flow in every column it touches, with a minus sign where the stock falls. The stock changes by the sum of its column. The row sum <b>Assets − Liabilities − Equity</b> must be zero: when a bank lends, its loans (asset) and the borrower's deposit (its liability) rise together, so the row balances, and that is how lending creates money. Unbalanced rows are flagged in red. A stock that appears in a second table is only checked there, not counted twice.</p>
  <h3>Estimation</h3>
  <p>In the Estimation tab, load a CSV with a time column and one column per observed series, match columns to model variables, and tick the constants to estimate with lower and upper limits (and optionally a normal prior). The sampler is the No-U-Turn variant of Hamiltonian Monte Carlo with a dense mass matrix adapted during warm-up, the same engine as the Cafe Estimation and Structural Studios. The difference here is that it works for whatever model you draw: the model is differentiated automatically, so gradients are exact, not approximated. Chains run in parallel in the background. Check that R-hat is below 1.01 and that there are no divergences; then read the posterior clouds and the fit against the data. <b>Put the medians into the model</b> copies the estimates back into the constants.</p>
  <h3>Opening models from other programs</h3>
  <p><b>File ▸ Open</b> reads Stella / iThink files saved as XMILE (<code>.stmx</code>, <code>.itmx</code>, <code>.xmile</code>) and Vensim <code>.mdl</code> files (equations and positions). Arrays (subscripts), modules and macros are not supported; a fixed DELAY is replaced by DELAY3. Check the import notes in the Inspector and compare a run with the original.</p>
  <h3>Saving</h3>
  <p>Your work is kept in this browser automatically. To keep it safely or hand it in, use <b>File ▸ Save</b> (a small .json file) and open it later with File ▸ Open. <b>Print report</b> makes a PDF with the notes, diagram, equations, graphs and any estimation results.</p>
  <h3>Keyboard</h3><p><kbd>S</kbd> stock · <kbd>F</kbd> flow · <kbd>V</kbd> variable · <kbd>L</kbd> link · <kbd>Esc</kbd> select tool · <kbd>Delete</kbd> remove · <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> undo / redo · <kbd>Ctrl</kbd>+<kbd>S</kbd> save · mouse wheel zoom · drag empty space to pan.</p>`;
}

// ---------- report ----------
function printReport(){
  const m = App.model, cm = App.cm, run = App.run;
  const svg = $('diagram').cloneNode(true);
  const vs = m.vars; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const v of vs){ const pts = [anchor(v)]; if (v.type === 'flow'){ const e = flowEnds(v); pts.push(e.a, e.b); } for (const p of pts){ x0 = Math.min(x0, p.x - 70); x1 = Math.max(x1, p.x + 70); y0 = Math.min(y0, p.y - 45); y1 = Math.max(y1, p.y + 55); } }
  const g = svg.querySelector('g'); if (g) g.setAttribute('transform', '');
  svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`); svg.setAttribute('width', '100%'); svg.style.height = 'auto';
  const css = '<style>' + Array.from(document.styleSheets).map(s => { try { return Array.from(s.cssRules).map(r => r.cssText).filter(t => /^\.(st|ax|fl|lbl|pipe|valve|cloud|lk|pol|gbadge|hl)/.test(t)).join('\n'); } catch (e){ return ''; } }).join('\n') + '</style>';
  let h = `<h1>${esc(m.name)}</h1><p>${esc(new Date().toLocaleString())} · Cafe Dynamics Studio</p>`;
  if (m.notes) h += `<h2>Notes</h2><p style="white-space:pre-wrap">${esc(m.notes)}</p>`;
  h += `<h2>Diagram</h2><div class="pg">${css}${svg.outerHTML}</div>`;
  h += `<h2>Equations</h2><p>Time ${m.settings.start} to ${m.settings.stop}, DT ${m.settings.dt}, ${m.settings.method.toUpperCase()}${m.settings.timeUnit ? ', time unit ' + esc(m.settings.timeUnit) : ''}.</p><table><tr><th>Name</th><th>Type</th><th>Equation / initial value</th><th>Units</th><th>Description</th></tr>`;
  for (const v of vs) h += `<tr><td>${esc(v.name)}</td><td>${v.type === 'aux' ? (isConstVar(v) ? 'constant' : 'variable') : v.type}</td><td><code>${esc(v.eq)}</code>${v.graph ? ' (graphical function)' : ''}</td><td>${esc(v.units)}</td><td>${esc(v.doc)}</td></tr>`;
  h += '</table>';
  for (const t of m.godley){
    h += `<h2>Godley table: ${esc(t.name)}</h2><table><tr><th>Transaction</th>${t.cols.map(c => `<th>${esc((varById(c.stock) || {}).name)} (${c.kind})</th>`).join('')}</tr>`;
    for (const r of t.rows) h += `<tr><td>${esc(r.label)}</td>${t.cols.map(c => `<td><code>${esc((r.cells || {})[c.stock] || '')}</code></td>`).join('')}</tr>`;
    h += '</table>';
  }
  if (cm && run){
    h += '<h2>Results</h2>';
    const keys = (m.ui.graph || defaultGraph()).filter(k => cm.byKey.get(k));
    for (const k of keys){
      const cv = document.createElement('canvas'); cv.style.width = '640px'; document.body.appendChild(cv);
      lineChart(cv, { series: [{ x: run.t, y: run.V[cm.byKey.get(k).vi], color: colorFor(k), label: k, nolegend: true }], h: 200, xlab: m.settings.timeUnit || 'time' });
      h += `<div class="pg"><b>${esc(prettyName(cm.byKey.get(k).name))}</b><br><img src="${cv.toDataURL('image/png')}"></div>`; cv.remove();
    }
  }
  const R = Est.res;
  if (R){
    h += `<h2>Estimation</h2><p>${R.nch} chains, ${R.nd} draws, ${R.div} divergences, ${R.mode === 'onestep' ? 'one-step-ahead' : 'whole-path'} likelihood.</p><table><tr><th>Quantity</th><th>mean</th><th>sd</th><th>5%</th><th>median</th><th>95%</th><th>R-hat</th><th>ESS</th></tr>`;
    for (const s of R.stats) h += `<tr><td>${esc(s.name)}</td><td>${niceNum(s.mean)}</td><td>${niceNum(s.sd)}</td><td>${niceNum(s.q05)}</td><td>${niceNum(s.q50)}</td><td>${niceNum(s.q95)}</td><td>${s.rhat.toFixed(3)}</td><td>${s.ess.toFixed(0)}</td></tr>`;
    h += '</table>';
    document.querySelectorAll('#eFit canvas').forEach(c => { h += `<div class="pg"><img src="${c.toDataURL('image/png')}"></div>`; });
  }
  $('report').innerHTML = h;
  setTimeout(() => window.print(), 100);
}

// ---------- startup ----------
function loadExample(key){
  const ex = EXAMPLES.find(e => e.key === key); if (!ex) return;
  if (App.model && App.model.vars.length) snapshot();
  App.model = ex.make(); Est.res = null;
  afterLoad();
  toast('Loaded example: ' + ex.title);
}
function init(){
  $('exList').innerHTML = EXAMPLES.map(e => `<button data-ex="${e.key}">${esc(e.title)}<small>${esc(e.sub)}</small></button>`).join('');
  document.addEventListener('click', ev => {
    const menu = ev.target.closest('.menu');
    document.querySelectorAll('.menu').forEach(mn => { if (mn !== menu) mn.classList.remove('open'); });
    if (ev.target.id === 'bFile' || ev.target.id === 'bEx'){ menu.classList.toggle('open'); return; }
    const ex = ev.target.closest('[data-ex]'); if (ex){ menu.classList.remove('open'); loadExample(ex.dataset.ex); return; }
    const act = ev.target.closest('[data-act]'); if (act){ menu.classList.remove('open'); fileAct(act.dataset.act); }
  });
  $('fileIn').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { if (App.model.vars.length) snapshot(); importFile(f.name, r.result); } catch (e){ alert('Could not open ' + f.name + ':\n' + e.message); console.error(e); } };
    r.readAsText(f); ev.target.value = '';
  };
  document.querySelectorAll('#tools .tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => Panels.showPage(b.dataset.page));
  document.querySelectorAll('#subtabs [data-pane]').forEach(b => b.onclick = () => {
    Panels.pane = b.dataset.pane;
    document.querySelectorAll('#subtabs [data-pane]').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('#out .pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.pane));
    if (Panels.pane !== 'qLoops' && App.hl){ App.hl = null; renderDiagram(); }
    Panels.renderPane();
  });
  $('bPin').onclick = () => {
    if (!App.cm || !App.run) return;
    const data = {}; for (const v of App.cm.users) data[v.key] = Float64Array.from(App.run.V[v.vi]);
    App.pins.push({ label: 'pin ' + (App.pins.length + 1), t: Float64Array.from(App.run.t), data });
    if (App.pins.length > 6) App.pins.shift();
    toast('Run pinned. Change something and compare.'); Panels.renderPane(); Inspector.drawSpark();
  };
  $('bUnpin').onclick = () => { App.pins = []; Panels.renderPane(); Inspector.drawSpark(); };
  $('bUndo').onclick = undo; $('bRedo').onclick = redo;
  $('modelName').onchange = e => { snapshot(); App.model.name = e.target.value; saveLocal(); };
  const setNum = (id, prop) => $(id).onchange = e => { const x = parseFloat(e.target.value); if (!isFinite(x)) return; snapshot(); App.model.settings[prop] = x; changed({ keepInspector: true }); };
  setNum('sStart', 'start'); setNum('sStop', 'stop'); setNum('sDt', 'dt');
  $('sMethod').onchange = e => { snapshot(); App.model.settings.method = e.target.value; changed({ keepInspector: true }); };
  $('sUnit').onchange = e => { snapshot(); App.model.settings.timeUnit = e.target.value; changed({ keepInspector: true }); };
  document.addEventListener('keydown', ev => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); fileAct('save'); return; }
    if (typing) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y'){ ev.preventDefault(); redo(); return; }
    if (Panels.page !== 'pDiagram') return;
    if (ev.key === 'Delete' || ev.key === 'Backspace'){ if (App.sel){ ev.preventDefault(); deleteSelection(); } return; }
    if (ev.key === 'Escape'){ setTool('select'); if (drag){ drag = null; renderDiagram(); } return; }
    const k = ev.key.toLowerCase();
    if (!ev.ctrlKey && !ev.metaKey && !ev.altKey){ if (k === 's') setTool('stock'); else if (k === 'f') setTool('flow'); else if (k === 'v') setTool('aux'); else if (k === 'l') setTool('link'); }
  });
  // splitter
  const sp = $('splitter');
  sp.onpointerdown = e => {
    sp.setPointerCapture(e.pointerId);
    const startY = e.clientY, startH = $('results').getBoundingClientRect().height;
    sp.onpointermove = ev => { const h = Math.max(120, Math.min(window.innerHeight - 220, startH - (ev.clientY - startY))); document.documentElement.style.setProperty('--resH', h + 'px'); };
    sp.onpointerup = () => { sp.onpointermove = null; Panels.renderPane(); renderDiagram(); };
  };
  initDiagram();
  let saved = null; try { saved = JSON.parse(store.get('cds.model') || 'null'); } catch (e){}
  App.model = saved && saved.vars ? saved : EXAMPLES.find(e => e.key === 'population').make();
  afterLoad();
  updUndo();
  window.addEventListener('resize', debounce(() => Panels.renderPane(), 150));
}
function fileAct(a){
  if (a === 'new'){ if (App.model.vars.length && !confirm('Start a new empty model? (The current one can be brought back with Undo.)')) return; snapshot(); App.model = emptyModel(); Est.res = null; afterLoad(); }
  else if (a === 'open') $('fileIn').click();
  else if (a === 'save'){ download((App.model.name || 'model').replace(/[^\w\-]+/g, '_') + '.json', JSON.stringify(App.model, null, 1), 'application/json'); toast('Saved to your downloads folder'); }
  else if (a === 'exportcsv') exportCSV();
  else if (a === 'print') printReport();
}
window.addEventListener('DOMContentLoaded', init);

</script>
